[project]
name = "agenthive-backend"
version = "0.3.0-alpha.2"
description = "AgentHive private deployment enterprise AI platform backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<0.35",
  "pydantic-settings>=2.14.2,<3",
  "sqlmodel>=0.0.22,<0.0.23",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "alembic>=1.14,<1.15",
  "pyjwt>=2.13,<3",
  "bcrypt>=4.2,<5",
  "celery>=5.4,<5.6",
  "cryptography>=46.0.6,<51",
  "email-validator>=2.2,<2.4",
  "httpx>=0.28,<0.29",
  "langchain>=1.3.9,<2",
  "langchain-core>=1.2.22,<2",
  "langgraph>=1.0.10,<2",
  "minio>=7.2,<7.3",
  "python-multipart>=0.0.31,<0.1",
  "redis>=5.2,<6",
  "sentry-sdk>=2.0,<3.0",
  "pypdf>=6.13.3,<7",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "PyMuPDF>=1.24,<2",
  "pytesseract>=0.3,<0.4",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "mypy>=1.16,<1.17",
  "pytest>=9.0,<9.1",
  "pytest-asyncio>=1.4,<1.5",
  "ruff>=0.15,<0.16"
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract", "openpyxl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "minio", "minio.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["langsmith", "langsmith.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:The default value of `allowed_objects`.*"
]
