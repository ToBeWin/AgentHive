worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format agenthive_json escape=json
        '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr","upstream_status":"$upstream_status"}';

    access_log /var/log/nginx/access.log agenthive_json;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;
    # Keep the edge close to the backend's 50 MiB document limit while
    # leaving room for multipart headers. The backend remains authoritative.
    client_max_body_size 51m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # The production Compose port is bound to 127.0.0.1. Therefore only the
    # same-host TLS terminator may assert that the original request was HTTPS.
    # Match one exact scheme token so comma-separated/spoofed values fail shut.
    map $http_x_forwarded_proto $agenthive_forwarded_proto {
        default http;
        ~*^https$ https;
    }

    upstream agenthive_frontend {
        server frontend:80;
    }

    upstream agenthive_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Docker/install diagnostics intentionally probe these two endpoints
        # over the loopback HTTP origin. They must remain usable before the
        # customer's TLS terminator is configured.
        location = /api/v1/health {
            proxy_pass http://agenthive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
        }

        location = /api/v1/health/readiness {
            proxy_pass http://agenthive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_buffering off;
        }

        location /api/ {
            if ($agenthive_forwarded_proto != https) {
                return 308 https://$host$request_uri;
            }
            proxy_pass http://agenthive_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $agenthive_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            if ($agenthive_forwarded_proto != https) {
                return 308 https://$host$request_uri;
            }
            proxy_pass http://agenthive_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $agenthive_forwarded_proto;
            proxy_set_header X-Request-ID $request_id;
        }
    }
}
